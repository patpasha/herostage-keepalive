name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Hero Stage API
        run: |
          set +e
          URLS="https://heromode-spidey.onrender.com/api/health https://heromode-spidey.onrender.com/api/"
          for attempt in 1 2 3; do
            for url in $URLS; do
              if curl -fsS --max-time 90 "$url"; then
                echo
                echo "ok $url attempt=$attempt"
                exit 0
              fi
            done
            sleep 8
          done
          echo "keep-alive failed"
          exit 1
