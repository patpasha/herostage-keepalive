name: Live Activity scheduler

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-activity-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake TestFlight backend and run due Live Activities
        env:
          CRON_SECRET: ${{ secrets.LIVE_ACTIVITY_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 15 \
            --max-time 120 \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            https://heromode-spidey-testflight.onrender.com/internal/live-activities/tick