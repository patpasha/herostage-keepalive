name: Live Activity scheduler

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_latest:
        description: Send one diagnostic Live Activity to the latest TestFlight device
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-activity-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request signed GitHub identity
        id: oidc
        uses: actions/github-script@v8
        with:
          script: return await core.getIDToken('herostage-live-activity')
          result-encoding: string

      - name: Wake TestFlight backend and run Live Activity task
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.result }}
          TEST_LATEST: ${{ inputs.test_latest }}
        run: |
          test -n "$OIDC_TOKEN"
          endpoint="tick"
          if [ "$TEST_LATEST" = "true" ]; then
            endpoint="test-latest"
          fi
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 15 \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            "https://heromode-spidey-testflight.onrender.com/internal/live-activities/$endpoint"